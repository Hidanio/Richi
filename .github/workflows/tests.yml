name: Tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ['3.9', '3.12', '3.13', '3.14']
        # setup-python has no Python 3.9 for the Ubuntu 26.04 image behind ubuntu-latest.
        exclude:
          - os: ubuntu-latest
            python: '3.9'
        include:
          - os: ubuntu-24.04
            python: '3.9'
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install .
      - run: python -m unittest discover -s tests -v
      - run: python evals/evaluate_recall.py

  legacy-update:
    # Installed updaters are frozen; every published release must update to this
    # branch in place, directly and through each intermediate release. The oldest
    # and newest supported Python here; the release workflow also runs the others.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ['3.9', '3.14']
        # setup-python has no Python 3.9 for the Ubuntu 26.04 image behind ubuntu-latest.
        exclude:
          - os: ubuntu-latest
            python: '3.9'
        include:
          - os: ubuntu-24.04
            python: '3.9'
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install build
      - run: python -m build --wheel --outdir dist
      - run: python -m pip install --no-deps dist/*.whl
      - run: python scripts/release_manifest.py dist/*.whl
      - run: python tests/update_matrix_e2e.py dist
